# Builds and uploads native install packages for Windows, Linux & macOS
# Create and Publish a GitHub Release to activate this workflow.
# Tag will be used for version and must follow semver x.x.x format exactly or jpackage will fail
# Only digits allowed and must include major.minor.patch numbers.

name: Publish Assets
on:
  release:
    types:
      - published
jobs:
  build:
    permissions:
      contents: write
    name: ${{ matrix.os }} w/JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
        java: [ '21' ]
      fail-fast: false
    steps:
      #       ____          _  __     __   ___        ____                __
      #      / __ ) __  __ (_)/ /____/ /  ( _ )      / __ \ ____ _ _____ / /__ ____ _ ____ _ ___
      #     / __  |/ / / // // // __  /  / __ \/|   / /_/ // __ `// ___// //_// __ `// __ `// _ \
      #    / /_/ // /_/ // // // /_/ /  / /_/  <   / ____// /_/ // /__ / ,<  / /_/ // /_/ //  __/
      #   /_____/ \__,_//_//_/ \__,_/   \____/\/  /_/     \__,_/ \___//_/|_| \__,_/ \__, / \___/
      #                                                                            /____/
    - name: Set Platform
      run: |
        printf "OS: ${{ runner.os }}\n"
        printf "ARCH: ${{ runner.arch }}\n"
    - name: Git checkout
      uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Build with Gradle
      run: ./gradlew jpackage zipJpackageImage
    - name: Copy the RPM to the location required to build the ArchLinux package
      if: ${{ runner.os == 'linux' }}
      run: cp -t package/archlinux/maptool/ releases/maptool-*.rpm
      continue-on-error: true
    - name: Build ArchLinux package
      uses: 2m/arch-pkgbuild-builder@v1.16
      # This only even makes sense on Ubuntu.
      if: ${{ runner.os == 'linux' }}
      env:
        MAPTOOL_VERSION: ${{ github.event.release.tag_name }}
      with:
        target: 'pkgbuild'
        pkgname: 'package/archlinux/maptool'
        debug: false
    - name: Copy ArchLinux package back
      if: ${{ runner.os == 'linux' }}
      run: cp -t releases/ package/archlinux/maptool/maptool*.pkg.tar.zst
    - name: Build uberJar on Windows
      if: startsWith(matrix.os, 'windows')
      run: ./gradlew shadowJar
      # For debugging purposes...
    - name: List releases
      run: ls releases
      #    _       __ _             __
      #   | |     / /(_)____   ____/ /____  _      __ _____
      #   | | /| / // // __ \ / __  // __ \| | /| / // ___/
      #   | |/ |/ // // / / // /_/ // /_/ /| |/ |/ /(__  )
      #   |__/|__//_//_/ /_/ \__,_/ \____/ |__/|__//____/
      #
      #       __     _
      #      / /    (_)____   __  __ _  __
      #     / /    / // __ \ / / / /| |/_/
      #    / /___ / // / / // /_/ /_>  <
      #   /_____//_//_/ /_/ \__,_//_/|_|
      #
      #                               ____  _____
      #      ____ ___   ____ _ _____ / __ \/ ___/
      #     / __ `__ \ / __ `// ___// / / /\__ \
      #    / / / / / // /_/ // /__ / /_/ /___/ /
      #   /_/ /_/ /_/ \__,_/ \___/ \____//____/
      #
    - name: Set Mac Architecture Variable
      if: startsWith(matrix.os, 'macos')
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then
          echo "MAC_ARCH=apple-silicon" >> $GITHUB_ENV
        else
          echo "MAC_ARCH=intel" >> $GITHUB_ENV
        fi
    - name: Rename Mac OS Release Files
      if: startsWith(matrix.os, 'macos')
      run: |
        mkdir -p releases/renamed/
        cp releases/MapTool*.dmg releases/renamed/MapTool-${{ github.event.release.tag_name }}-${{ env.MAC_ARCH }}.dmg
        cp releases/MapTool*.pkg releases/renamed/MapTool-${{ github.event.release.tag_name }}-${{ env.MAC_ARCH }}.pkg
        cp releases/MapTool*-mac*.zip releases/renamed/MapTool-${{ github.event.release.tag_name }}-mac-${{ env.MAC_ARCH }}.app.zip
      continue-on-error: true
    - name: Upload release assets
      uses: softprops/action-gh-release@v3
      with:
        files: releases/*.*
